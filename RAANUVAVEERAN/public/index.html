<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="RAANUVAVEERAN – A Zoom-style video conferencing app built with Node.js and WebRTC." />
  <title>RAANUVAVEERAN – Video Meeting</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="landing-wrapper">
    <!-- Animated background orbs -->
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>

    <div class="landing-card glass">
      <div class="logo-section">
        <div class="logo-icon">📡</div>
        <h1 class="brand-name">RAANUVAVEERAN</h1>
        <p class="brand-tagline">Crystal-clear video meetings, anywhere.</p>
      </div>

      <div class="join-section">
        <div class="input-group">
          <span class="input-icon">🔑</span>
          <input
            id="roomId"
            type="text"
            placeholder="Enter Room ID"
            autocomplete="off"
            onkeydown="if(event.key==='Enter') join()"
          />
        </div>
        <button id="joinBtn" onclick="join()">
          <span>Join Meeting</span>
          <span class="btn-arrow">→</span>
        </button>
        <p class="or-divider"><span>or</span></p>
        <button id="createBtn" class="secondary-btn" onclick="createRoom()">
          ✨ Create New Room
        </button>
      </div>

      <p class="footer-note">No account needed. Just paste the Room ID and go.</p>
    </div>
  </div>

  <script>
    function join() {
      const room = document.getElementById("roomId").value.trim();
      if (!room) {
        document.getElementById("roomId").classList.add("shake");
        setTimeout(() => document.getElementById("roomId").classList.remove("shake"), 500);
        return;
      }
      window.location.href = `/room.html?room=${encodeURIComponent(room)}`;
    }

    function createRoom() {
      const roomId = Math.random().toString(36).substring(2, 10).toUpperCase();
      document.getElementById("roomId").value = roomId;
      join();
    }
  </script>
</body>
</html>
